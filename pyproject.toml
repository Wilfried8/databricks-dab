[project]
name = "dab_test_labs"
version = "0.0.1"
authors = [{ name = "w43376199@gmail.com" }]
requires-python = ">=3.10,<=3.13"

[dependency-groups]
dev = [
    "pytest",

    # Code completion support for Lakeflow Declarative Pipelines, also install databricks-connect
    "databricks-dlt",

    # databricks-connect can be used to run parts of this project locally.
    # Note that for local development, you should use a version that is not newer
    # than the remote cluster or serverless compute you connect to.
    # See also https://docs.databricks.com/dev-tools/databricks-connect.html.
    "databricks-connect>=15.4,<15.5",
]
lint = [
    "ruff>=0.6.4",
    "black>=24.8.0",
    "nbqa>=1.9.0",
]

[tool.ruff]
target-version = "py311"
extend-exclude = ["*.ipynb"]
builtins = ["spark"]

[tool.ruff.format]
preview = true

[tool.pytest.ini_options]
pythonpath = "src"
testpaths = [
    "tests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dab_test_labs"]

[project.scripts]
main = "dab_test_labs.main:main"
